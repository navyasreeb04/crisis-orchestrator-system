name: crisis_orchestrator_mobile
description: Crisis orchestrator mobile client for hospitality emergency response.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cloud_firestore: ^5.6.8
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  firebase_storage: ^12.4.6
  flutter:
    sdk: flutter
  flutter_sms: ^2.3.3
  geolocator: ^14.0.1
  google_maps_flutter: ^2.12.1
  path_provider: ^2.1.5
  record: ^6.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
